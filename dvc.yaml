stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - src/common.py
      - data/raw
    params:
      - prepare
    outs:
      - data/prepared

  augment:
    cmd: python src/augment.py
    deps:
      - src/augment.py
      - src/common.py
      - data/prepared/train.npz
    params:
      - augment
    outs:
      - data/augmented
      - plots/augment_examples.png:
          cache: false

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/common.py
      - data/prepared/train.npz
      - data/augmented/train.npz
    params:
      - train
    outs:
      - models/model.pkl
    metrics:
      - metrics/train.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - src/common.py
      - models/model.pkl
      - data/prepared/test.npz
    metrics:
      - metrics/eval.json:
          cache: false
    plots:
      - plots/confusion.csv:
          cache: false
          template: confusion
          x: predicted
          y: actual
      - plots/per_class.csv:
          cache: false
          x: class
          y: f1
          template: bar_horizontal
      - plots/confusion.png:
          cache: false

  train_all:
    cmd: python src/train_parallel.py
    deps:
      - src/train_parallel.py
      - src/train.py
      - src/common.py
      - data/prepared
      - data/augmented/train.npz
    params:
      - train
      - train_all
    outs:
      - models/parallel
    metrics:
      - metrics/parallel.json:
          cache: false
    plots:
      - plots/parallel_timeline.png:
          cache: false
