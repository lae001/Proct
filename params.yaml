# Параметры пайплайна. Любой параметр можно переопределить при запуске
# эксперимента: dvc exp run -S train.model=svm -S train.dataset=augmented

prepare:
  n_train: 10000      # размер обучающей подвыборки (из 60000), стратифицированно
  seed: 42

augment:
  copies: 1           # сколько аугментированных копий создать для каждого изображения
  rotation: 0         # максимальный угол поворота, градусы
  shift: 0            # максимальный сдвиг, пиксели
  zoom: 0             # максимальное относительное масштабирование
  flip: true          # горизонтальное отражение (с вероятностью 0.5)
  noise: 0            # СКО гауссова шума (яркость пикселей в [0, 1])
  seed: 42

train:
  dataset: augmented  # original | augmented
  model: svm           # logreg | random_forest | mlp | svm
  seed: 42
  logreg:
    C: 0.1
    max_iter: 1000
  random_forest:
    n_estimators: 200
    max_depth: 0      # 0 - без ограничения глубины
  mlp:
    hidden:
    - 256
    - 128
    alpha: 0.0001
    max_iter: 40
  svm:
    C: 10.0
    pca: 60           # число главных компонент перед SVM (0 - без PCA)
